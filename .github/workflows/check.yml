name: check
on: [push, pull_request]
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Caveman for transport integration test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          CAVEMAN_HOME="$RUNNER_TEMP/caveman-check" CAVEMAN_TELEMETRY=0 node node_modules/@caveman-ai/cli/dist/index.js setup --install
          echo "CAVEMAN_PROXY_BIN=$RUNNER_TEMP/caveman-check/bin/caveman-proxy" >> "$GITHUB_ENV"
      - name: Find OpenSSL on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
            $opensslDirectory = Join-Path $env:ProgramFiles 'Git\usr\bin'
            if (-not (Test-Path (Join-Path $opensslDirectory 'openssl.exe'))) { throw 'OpenSSL is required for TLS verification' }
            $opensslDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - run: node --test tests/*.test.mjs
      - run: python3 -m py_compile stack
        if: runner.os == 'Linux'
      - run: python3 -m unittest discover -s tests -p '*_test.py'
        if: runner.os == 'Linux'
      - run: git diff --check
